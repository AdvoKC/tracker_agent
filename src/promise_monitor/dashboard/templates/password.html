{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  {% if user.must_change_password %}<p class="flash err">You must set a new password before continuing.</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="cur">Current password</label><input id="cur" type="password" name="current" autocomplete="current-password" required>
    <label for="new">New password <span class="hint">at least {{ min_len }} characters</span></label><input id="new" type="password" name="new" autocomplete="new-password" required minlength="{{ min_len }}">
    <label for="again">Repeat new password</label><input id="again" type="password" name="again" autocomplete="new-password" required minlength="{{ min_len }}">
    <div class="actions"><button type="submit">Change password</button></div>
  </form>
</div>
{% endblock %}
