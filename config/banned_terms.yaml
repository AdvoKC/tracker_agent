  - failed to
  - failure
  - shockingly
  - shocking
  - sadly
  - unfortunately
  - fortunately
  - commendable
  - laudable
  - lauded
  - slammed
  - blasted
  - disappointing
  - impressive
  - remarkable
  - controversial
  - so-called
  - despite
  - only managed
  - empty promise
  - broken promise
