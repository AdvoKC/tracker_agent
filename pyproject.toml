[project]
name = "promise-monitor"
version = "0.1.0"
description = "AdvoKC Promise Tracker Monitor: detects promisetracker.ng changes and drafts neutral 100-word articles for coordinator review."
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "cryptography>=44",
    "fastapi>=0.115",
    "gspread>=6.1",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
promise-monitor = "promise_monitor.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promise_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["N999", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "integration: needs a reachable PostgreSQL (DATABASE_URL); skipped otherwise",
]
